<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="grad_43" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="glow_43" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </radialGradient>
    <filter id="shadow_43" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" fill="url(#grad_43)" />
  
  <!-- Image overlay with category food texture -->
  <image href="/images/nuggets.jpg" width="600" height="450" preserveAspectRatio="xMidYMid slice" opacity="0.55" />
  <rect width="600" height="450" fill="url(#glow_43)" />

  <!-- Geometric Frame Pattern -->
  <rect x="16" y="16" width="568" height="418" rx="24" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <rect x="22" y="22" width="556" height="406" rx="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="300" cy="180" r="110" fill="#facc15" opacity="0.25" />
  
  <!-- Main Food Emoticon Visual -->
  <g filter="url(#shadow_43)">
    <circle cx="300" cy="175" r="85" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <text x="300" y="215" font-size="95" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🍗</text>
  </g>

  <!-- Top Badge: Category and Pack Quantity -->
  <g>
    <rect x="35" y="35" rx="10" ry="10" width="150" height="32" fill="#b91c1c" stroke="#fde047" stroke-width="1.5" />
    <text x="110" y="56" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="1">KIDS SPECIAL</text>
  </g>

  <g>
    <rect x="430" y="35" rx="10" ry="10" width="135" height="34" fill="#000000" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5" />
    <text x="497" y="57" fill="#fef08a" font-size="14" font-weight="900" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif">06 pcs</text>
  </g>

  <!-- Halal &amp; Fresh Badge -->
  <g>
    <circle cx="530" cy="120" r="26" fill="#065f46" stroke="#34d399" stroke-width="2" />
    <text x="530" y="118" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">100% HALAL</text>
    <text x="530" y="130" fill="#a7f3d0" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">حلال خالص</text>
  </g>

  <!-- Bottom Details Card -->
  <rect x="30" y="280" rx="18" ry="18" width="540" height="135" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Urdu Product Name -->
  <text x="300" y="322" fill="#fef08a" font-size="24" font-weight="bold" text-anchor="middle" font-family="'Noto Nastaliq Urdu', 'Segoe UI', serif">چکن چیز لولی پاپ</text>
  
  <!-- English Product Name -->
  <text x="300" y="355" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif">Chicken Cheese Lolypop</text>

  <!-- Pricing &amp; Quality Bar -->
  <line x1="60" y1="372" x2="540" y2="372" stroke="#334155" stroke-width="1" />
  
  <text x="70" y="395" fill="#94a3b8" font-size="12" font-weight="bold" font-family="sans-serif">AUTHENTIC HYDERI (SINCE 1970)</text>
  <text x="530" y="397" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="end" font-family="'Outfit', sans-serif">Rs. 350/-</text>
</svg>